services:
  jenkins:
    build: .
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  smee:
    image: node:22-alpine
    command: npx --yes smee-client@1.2.3 --url ${SMEE_URL} --target http://jenkins:8080/github-webhook/
    depends_on:
      - jenkins

volumes:
  jenkins_home:
